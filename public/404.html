<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BrickYard</title>
    <script>
      // GitHub Pages serves this static file for any path it doesn't recognize —
      // which is every deep link and every reload, since Pages has no server-side
      // routing. This redirects back to the app's own base path, carrying the
      // requested path in a query param; index.html reads it and restores the real
      // URL with history.replaceState before the router reads location.pathname.
      var base = '/brickyard/';
      var path = window.location.pathname.slice(base.length).replace(/\/$/, '');
      var query = window.location.search ? window.location.search.slice(1) : '';
      var redirectQuery = 'redirect=' + encodeURIComponent(path) + (query ? '&' + query : '');
      window.location.replace(base + '?' + redirectQuery + window.location.hash);
    </script>
  </head>
  <body></body>
</html>
